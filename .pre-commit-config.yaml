default_install_hook_types: [pre-commit, pre-push, pre-merge-commit]
default_stages: [pre-commit]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-toml
  - id: check-yaml
  - id: check-added-large-files
  - id: detect-private-key

- repo: https://github.com/crate-ci/typos
  rev: v1.32.0
  hooks:
    - id: typos

- repo: local
  hooks:
  - id: rust-format
    name: rustfmt
    entry: just format
    language: system
    types: [rust]
    pass_filenames: false
    require_serial: true
    stages: [pre-commit, pre-merge-commit]

- repo: local
  hooks:
  - id: rust-test
    name: nextest (push to master)
    entry: sh .config/hooks/rust-test.sh pre-push
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-push]
  - id: rust-test-merge
    name: nextest (merge into master)
    entry: sh .config/hooks/rust-test.sh pre-merge-commit
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-merge-commit]

default_language_version:
  rust: stable
  python: python3.12
